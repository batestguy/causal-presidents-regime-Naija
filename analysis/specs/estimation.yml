# Stage 6 — estimation
#
# The stage that turns "what can be estimated" into "what is estimated, on the record". Everything that
# could be a magic number lives here: the sample, the specifications, the inference, the checks that can
# kill a result, and the statements the engine is allowed to make about it.
#
# ---------------------------------------------------------------------------------------------
# What this stage is answering, and what it is not
# ---------------------------------------------------------------------------------------------
# Stage 5 returned **0 of 36 cards passing**: Family A dropped, B degraded, C infeasible. This stage does
# not overturn that. It asks the narrower question the landed data can actually carry, and it answers it
# with the same artifacts Stage 5 read:
#
#   * **The presidential-tenure question is not answerable.** Four to five administrations and 27 annual
#     observations per series put the minimum detectable effect at 35-80 residual standard deviations
#     (Stage 5, "Degrees of freedom and the detectable effect"). No estimator fixes that. Any "Buhari
#     caused X" number this project could produce would be a restatement of its own assumptions.
#
#   * **Two fiscal questions are.** Both use data landed after Stage 5 ran:
#       - **Design A** — does a state-month with a larger federal allocation see fewer conflict
#         fatalities? The dose landed 2026-10-16 (114 months x 36 states) and the state-attributed
#         outcome landed 2026-10-17 (UCDP GED, 1990-2024, keyless: C-45). This is the Family A estimand,
#         now runnable.
#       - **Design B** — how much of a Brent shock reaches the states, and when? National monthly,
#         114 months, log-log local projection.
#
#   * **Design A is estimated and is not identified, and the report says so.** The dose's within-state,
#     within-month variation is **oil-price-driven** (residual sd 0.50 in Delta/Bayelsa/Rivers against
#     0.11 elsewhere): what is left after state and month effects is mostly the 13 % derivation share
#     moving with the oil price. A placebo that leads the dose 24 months recovers an estimate of the same
#     size as the estimate itself. The design is therefore reported as *estimated, not identified* —
#     a measured verdict rather than a caveat, and the reason both designs are run together.
version: 1
labelled: "2026-10-18"
spec_path: "analysis/specs/estimation.yml"
engine: "analysis/R/03_estimate.R"
verifier: "tests/verify_stage6.py"

# ---------------------------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------------------------
# The analytical base, read from the DuckDB file the dbt project builds. No staging CSV is read
# directly: if a number here came from somewhere the base does not carry, the base would not be the
# thing under test.
input:
  database: "data/analytics.duckdb"
  panel_table: "main_analytics.state_panel"
  national_faac_table: "main_analytics.faac_national_monthly"
  fact_metric_table: "main_analytics.fact_metric"
  oil_metric_id: oil

# ---------------------------------------------------------------------------------------------
# Design A — state dose-response (the Family A estimand)
# ---------------------------------------------------------------------------------------------
design_a:
  id: A
  name: "State dose-response: does a larger federal allocation reduce conflict fatalities?"
  estimand: >-
    The elasticity of monthly conflict fatalities in a state with respect to that state's FAAC gross
    allocation: a 1 % larger allocation, in a state-month, against the state's own average and the
    country's month.
  unit: state-month
  exposure:
    column: faac_gross_total_naira
    transform: log
    # **Why logarithmic, when the card writes the dose per capita (D1).** A per-capita dose needs a state
    # population series, which is an unmade decision (X-09). In a specification with state fixed effects
    # the two are the same estimand up to `-log(population)`, and log population is a state-level
    # constant that the fixed effect absorbs — so the elasticity does not need the denominator, and
    # buying one would not change the number. This is the resolution of X-09 for this design, not a way
    # around it: the *level* claim ("a state with more people gets more money") still needs the series.
  outcome: fatalities
  # The two robustness outcomes are the same archive: an event count is a different object from a death
  # toll (one massacre is one incident and 200 deaths), and civilian deaths are the claim a transfer
  # would have to move if it protected civilians rather than winning.
  robustness_outcomes: [incidents, fatalities_civilians]
  estimator: "PPML (Poisson pseudo-maximum-likelihood), fixest::fepois"
  estimator_note: >-
    Fatalities are counts with a mean of 6.2 and a maximum of 430 against 80 % zeros: a log-OLS would
    drop or fudge the zeros and a linear model would let fitted negatives appear. PPML is the estimator
    for a non-negative, over-dispersed count with high-dimensional fixed effects.
  sample:
    require_dose_status: observed
    require_security_status: observed
    min_exposure: 1
    window: {start: "2016-12", end: null}
    why: >-
      The intersection of the two series as landed: FAAC begins 2016-12 (the OAGF/NBS archives do not
      publish the PDP era — harmonisation.yml `state_dose_d1_coverage`) and UCDP ends 2024-12 (GED 25.1).
      3,456 state-months. The window is a property of the data, not a choice, and it is why Design A is
      an APC-era design whatever the card says.
  fixed_effects: [state_id, year_month]
  inference:
    covariance: cluster_by_state
    clusters: 36
    note: >-
      Clustered by state, which is the level the dose is assigned at. 36 clusters is few; the wild-cluster
      bootstrap is the standard fix and is **not** applied here, so the reported p-values should be read
      as slightly optimistic. Recorded as a limitation rather than papered over with a bootstrap this
      stage has not validated.
  checks:
    # A placebo is not decoration here: it is the check that decides whether the estimate means anything.
    placebo_lead_months: 24
    # ---- the decisive check: a mis-timed dose ---------------------------------------------------
    # The assumption this design makes is that a state's allocation and its conflict in the same month
    # are connected. The null that tests it is therefore *timing*: refit the same estimator with the
    # state's dose series shifted by a non-zero offset, and ask how often a mis-timed dose produces an
    # estimate at least this large. Each offset is compared against the observed estimate fitted on
    # **the same rows** (the shift costs observations at the ends), so the comparison is paired and the
    # sample size is not doing the work.
    lead_shift:
      offsets: [-30, 30]      # every non-zero month offset in the closed interval
      why: >-
        A valid null for this dose. The alternative `shuffle_across_states_within_month` was tried first
        and is reported, but it is not decisive: the dose's cross-state mean is a fixed state
        characteristic (population, size), which the state fixed effects already absorb, so that
        permutation compares the estimate against a null with far less structure than the design
        actually uses — it is too easy to beat. Shifting each state's own series in time keeps the
        cross-state structure, the within-state mean and the panel's shape, and destroys only the
        alignment the estimate claims.
    secondary_check:
      scheme: "shuffle the dose across states within each month"
      n_draws: 499
      seed: 20261017
      why: >-
        Reported beside the lead-shift distribution because it is a real null for a different question
        ("is the state-to-dose assignment meaningful at all?"), and because publishing the check that
        did *not* decide the verdict is the point of running two.
  verdict_rule: >-
    Reported as `identified` only if the lead-shift p-value is below 0.05 **and** the 24-month placebo
    estimate is smaller in magnitude than the estimated coefficient. Otherwise `estimated_not_identified`,
    with the failed check named. Fixed before the numbers were read.

# ---------------------------------------------------------------------------------------------
# Design B — national fiscal transmission
# ---------------------------------------------------------------------------------------------
design_b:
  id: B
  name: "Brent crude to state allocations: how much of an oil shock reaches the states, and when?"
  estimand: >-
    The cumulative elasticity of the national monthly FAAC allocation to the 36 states with respect to
    a Brent crude shock: the proportional change in the allocation h months after a 1 % price move.
  unit: national-month
  exposure:
    column: oil
    transform: log_first_difference
    why: >-
      The shock is the month-on-month change in the log price, not the level. A level regression between
      two trending series reports a relationship that is mostly shared trend, and Nigeria's own output
      decisions cannot move Brent: the country is a price taker in a market two orders of magnitude
      larger than its exports, which is what makes the direction of causation defensible here.
  outcome:
    column: gross_total_naira
    table: main_analytics.faac_national_monthly
    transform: log_cumulative_change
  estimator: "local projection (Jorda), OLS per horizon, statsmodels-equivalent HAC"
  sample:
    require: "a FAAC month with an oil month and a full h-month lead"
    window: {start: "2016-12", end: null}
  horizons: [0, 1, 2, 3, 4, 5, 6, 9, 12]
  controls: [month_of_year]
  inference:
    covariance: newey_west
    maxlags: 12
    why: >-
      12 lags is the conventional bandwidth for monthly data and it covers the fiscal year; the
      overlapping-horizon residuals in a local projection are autocorrelated by construction, so a
      heteroskedasticity-only standard error would be wrong in a way that flatters the estimate.
  checks:
    # The allocation is published for revenue accrued in an earlier month, so a positive response at
    # h=0 with no lag structure would be evidence of a leak, not of transmission.
    expect_peak_horizon: [2, 4]
    placebo_lead_months: 6
    why: >-
      The lead placebo tests the direction: if a future oil shock "predicts" today's allocation, the
      relationship is a common trend rather than a transmission channel.
  verdict_rule: >-
    `estimated` if the cumulative response is positive at the declared horizon band with a HAC t above
    1.96 at some horizon in it, and the lead placebo at 6 months is smaller in magnitude. Reported with
    its confidence bounds either way; a null is a result.

# ---------------------------------------------------------------------------------------------
# Design C — synthetic control on annual outcomes
# ---------------------------------------------------------------------------------------------
design_c:
  id: C
  status: not_run
  why: >-
    The reason changed on 2026-10-18, and the change is the point. With the original 13-country pool
    Stage 5 recorded `infeasible`: the pre-treatment fit failed on every outcome and window. The pool has
    since been widened to 99 candidates screened on oil dependence, region/income band and coverage
    (`ingestion/flows/pull_worldbank_donors.py`), and re-running the gate (vintage 2026-10-18) passes
    **u5mr on 3 of its 4 runnable windows** (ratios 0.0014-0.0042 against the declared 0.10 threshold,
    ratio-on-differences 0.013-0.024) and fails `gdp_growth` (1 of 4) and `cpi_yoy` (0 of 4) — so the
    design is no longer infeasible *for want of a pool*. It is not estimated here because the estimator
    and its placebos are not built: `Synth`/`coresynth` still has to be fitted, and the in-space and
    in-time placebos Stage 5 deferred to Stage 6 have not been run. Two cautions travel with the pass and
    are on the artifact: a 99-donor simplex can fit any pre-period (the yaradua gdp_growth window reaches
    a ratio of 1.7e-06, which is interpolation rather than validation), and the gate was always declared
    necessary-not-sufficient. The pass is permission to build Design C, not evidence that its fit is real.
  next_step: "Build the Design C estimator and its placebos on the `u5mr` windows the gate now passes"
  gate_artifact: "registry/diagnostics/2026-10-18/diagnostics.json"

# ---------------------------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------------------------
output:
  root: "registry/estimates"
  format: [estimates.json, report.md]
  json_contract:
    - "one row per estimated specification, keyed by (design, outcome, estimator, controls)"
    - "every row carries n_obs, coefficient, standard_error, ci_low, ci_high, p_value"
    - "every design carries its checks (placebo, permutation, peak horizon) as its own object"
    - "every design carries a verdict from its declared verdict_rule, never a hand-typed label"
    - "the sample's first and last month are carried, so a window that moved is visible"
