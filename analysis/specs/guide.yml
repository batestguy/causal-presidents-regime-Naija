# The guided flow's wording — declared, not typed into the renderer
#
# Every sentence, status word and label the site can show lives here, so that the wording is reviewable as a
# document and the site is not the place where prose is invented. `tests/verify_guide.py` checks coverage both
# ways: every design, status, reason code and grouping the renderer may show must have an entry, and every entry
# must be used by at least one rendered page.
#
# **Placeholders.** `cover.paragraphs` and `study.caption` may carry `{name}` slots. The build substitutes them
# from the artifacts and refuses to write a page if a slot has no value, or if a value has no slot. The declared
# slots are listed under `placeholders` and are the only names the renderer will fill.

version: 1
layer: "plain words for the guided flow: design names, status words, reasons, cover copy"

placeholders:
  window_first: "the study window's first month, from registry/series/<vintage>/index.json"
  window_last: "the study window's last month"
  administrations: "the number of administrations, from registry/reference/administrations.json"
  spine_total: "outcome-months covered by the twelve panels"
  spine_observed: "outcome-months that are observations"
  spine_interpolated: "outcome-months filled in between observations"
  spine_unobserved: "outcome-months with no observation at all"
  estimated: "cards carrying a published number, from registry/dags/index.json"
  cards: "cards in the registry"

cover:
  eyebrow: "Nigeria · 1999–present"
  title: "Causal Presidents"
  caption: "Presidential transitions and national outcomes in Nigeria, 1999–present."
  instruction: "Causal models have assumptions. Study them before you read the numbers."
  rail_heading: "Five administrations"
  rail_note: "The faces are the study window, not a scorecard. No number on this site belongs to one president."
  ratio: "{estimated} of {cards} model cards carry a published number; the rest say why not."
  portrait_credits: "Photograph credits"
  paragraphs:
    - "What can and cannot be said about Nigeria between {window_first} and {window_last}, across {administrations} administrations."
    - "The twelve outcomes cover {spine_total} outcome-months: {spine_observed} observed, {spine_interpolated} filled in, {spine_unobserved} with no observation at all. Each panel draws the three states differently."

study:
  heading: "What do you want to study?"
  intro: "Pick a category, then an outcome. Every outcome has a page: the comparison the data supports, or the reason there is none."
  caption: "{spine_total} outcome-months across the twelve: {spine_observed} observed, {spine_interpolated} filled in, {spine_unobserved} with nothing."
  next: "Next"
  next_disabled: "Pick at least one outcome to continue."
  category_label: "Category"
  groups:
    health: "Health"
    education: "Education"
    security: "Security"
    economy: "Economy"

compare:
  heading: "What this data can tell you"
  intro: "The comparison the project judged usable for each outcome, and what it assumes."
  tenure_note: "This page will not say which president did better. That needs a counterfactual this data does not have: 22 to 23 annual observations per outcome, against four to five administrations."
  chosen_label: "The comparison chosen for you"
  assumes_label: "What it assumes"
  number_label: "Number published"
  no_number_label: "No number"
  closest_label: "The closest thing we have"
  prototype_note: "Prototype: this page is the second screen only. The graph, estimate and chart screens are specified and not yet built."

designs:
  A:
    name: "State dose-response DiD"
    short: "DiD"
    plain_comparison: "states that received more federal money, compared with states that received less"
    assumes: "that no other change moved states with high and low federal allocations differently in the same months"
  B:
    name: "National VECM / ARDL time series"
    short: "Time series"
    plain_comparison: "the national money that reached the states, after the oil price moved, compared with what happened before it moved"
    assumes: "that the oil price is the only thing moving that channel in the same months"
  C:
    name: "Synthetic control (cross-country)"
    short: "Synthetic control"
    plain_comparison: "Nigeria compared with a made-up Nigeria built from similar countries"
    assumes: "that the made-up Nigeria tracks what Nigeria would have done without the change"

# Stage 5's card verdicts, in the reader's words. The tone is the colour the page may use.
status:
  pass:
    word: "usable"
    tone: "good"
    sentence: "The check this comparison needed passed before anything was estimated."
  degraded:
    word: "usable with a warning"
    tone: "warn"
    sentence: "The comparison runs, but on a weaker version of what the design asked for."
  fail:
    word: "the check it needed failed"
    tone: "bad"
    sentence: "The comparison was tested and did not pass; the number it would carry is either absent or published as not identified."
  not_attempted:
    word: "not attempted"
    tone: "bad"
    sentence: "The design could not be run for this outcome, so there is nothing to show."

# The registry's closed set of reasons a card carries no number.
reasons:
  outcome_series_absent:
    sentence: "There is no usable series to estimate on."
  no_specification_declared:
    sentence: "No specification was declared for this pair, so nothing was estimated."
  design_result_is_channel_level:
    sentence: "This design was run, but its result is about the money channel rather than about this outcome."
  design_not_run:
    sentence: "The design was not run for this outcome."

coverage:
  ok: "measured"
  partial: "partly measured"
  declared_gap: "declared gap"

# The parties the five administrations belong to, with the colours their Wikipedia infoboxes declare. The site
# draws these as vertical bands behind each portrait — a declared backdrop, not an endorsement (see
# docs/portraits.md §1, and the override recorded in docs/decisions.md).
parties:
  PDP:
    name: "Peoples Democratic Party"
    bands: ["#006903", "#FFFFFF", "#F0001C"]
    source: "English Wikipedia infobox colour swatches, retrieved 2026-10-27"
  APC:
    name: "All Progressives Congress"
    bands: ["#87BEEB", "#39944A", "#FFFFFF", "#E52B33"]
    source: "English Wikipedia infobox colour swatches, retrieved 2026-10-27"

# The national flag, drawn as a backdrop behind the cover's photographs: a green-white-green vertical triband.
national_flag:
  bands: ["#008751", "#FFFFFF", "#008751"]
  source: "Nigerian flag, green-white-green vertical triband"

direction:
  up: "higher is better"
  down: "lower is better"

groupings:
  party_tenure:
    plain: "by who was in power"
    technical: "party × tenure stratum"
  state_dose_quartile:
    plain: "by how much money a state received"
    technical: "FAAC dose quartile"

labels:
  technical_expander: "The technical version"
  plain_reading: "What this says in plain words"
  graph_heading: "The assumption, drawn"
  chart_heading: "The comparison, drawn"
  alternatives_heading: "The other graphs for this outcome"
  failed_check_prefix: "Failed its check"
  back: "Back"
  next: "Next"

steps:
  cover: "Start"
  study: "What to study"
  compare: "The comparisons"
  graph: "The assumption"
  estimates: "The estimate"
  chart: "The chart"
  ask: "Ask"

ask:
  heading: "Ask the corpus"
  intro: "The same gate and passages the local app uses, running in this browser. Nothing is fetched and no model is called."
  placeholder: "e.g. how much of the monthly series is observed?"
  button: "Ask"
  empty: "Type a question about the study."
  loading: "Reading the corpus…"
  error: "The answer layer did not load in this browser. The local app's Ask tab reads the same corpus."
  measured: "{answered} of {total} questions in the measured set are answered; the rest are declined by the answer contract and say why."
  deeper: "The design-level results"
  refused_heading: "Why this is refused"
  declined_heading: "Why there is no answer"
  source_heading: "Where this comes from"

results:
  heading: "The estimate, in plain words"
  number: "The published coefficient is {coefficient}, with a 95 % interval from {ci_low} to {ci_high} and p = {p_value}."
  includes_zero: "That interval includes zero, so this data cannot rule out no effect at all."
  excludes_zero: "That interval stays on one side of zero."
  sample: "It rests on {n_obs} observations over {n_units} units, {first_month} to {last_month}."
  verdict: "Verdict: {verdict}."
  failed_check: "The check that decided it: {failed_check}."
  no_number: "There is no number for this comparison. {reason_sentence}"
  channel_note: "The published number is about the national money channel, not about this outcome."
  tiny_note: "A coefficient of this kind is read as a proportional change: {reading}."
  expander: "The technical version"
  groups_heading: "What each group's average is"
  stamp_note: "Every chart on this page is a description of the series. None of them is a causal comparison."

chart:
  stamp: "description, not a causal comparison"
  observed_mark: "a dot is a month that exists"
  interpolated_mark: "a dotted line is a month filled in between two observations"

changepoint:
  heading: "When the series changes"
  intro: "A segmented fit on the native observations, with the number of breaks chosen by BIC. It describes the shape of the series and nothing about who was in office."
  marker_label: "the series changes here"
  note: "A break is a description of the series. It is not evidence that a presidency caused it."
  refused: "No break is fitted for this outcome: it has too few native observations for the search to be meaningful."
  timing_note: "A break within two months of a swearing-in is recorded as timing only."

# Stage 8g - the tenure description (analysis/specs/tenure.yml)
tenure:
  heading: "Deviation from the long-run trend"
  note: "Native observations only, against a trend fitted without knowing who was in power. A deviation names a window, not a causal claim about a president."
  heads: ["Tenure", "Party", "Points", "Deviation, range across spans"]
  contrast_heading: "Largest pairwise contrast"
  refused: "Too few native observations to describe a deviation."

# Screen 6b — the design-level results. One section per artifact family. Every value below is filled from an
# artifact field; the templates carry no number of their own.
design_results:
  heading: "The design-level results"
  intro: "The three figures that decided the verdicts below. Each is drawn by R from the same rows this page counts."
  figure_note: "The figure is the artifact. If it were one re-fit behind the table, its recorded byte count would no longer match the file."
  verdict_label: "Verdict"
  published_heading: "What was published"
  row: "{outcome} — {coefficient}, 95 % interval [{interval}], {obs} observations"
  channel_outcome: "the national money that reached the states"
  outcome_labels:
    fatalities_civilians: "civilian fatalities (a UCDP item counted inside the security outcome)"
  checks_heading: "The checks that decided it"
  grid_heading: "What the grid found"
  flip: "{axis} = {level} — {n_opposite} of {n} specifications point the other way"
  support: "{n_positive} of {n} specifications are positive, {n_negative} negative, and {n_near_zero} sit inside the near-zero band."
  spread: "Across the grid the coefficient runs from {min} to {max}."
  placebo: "The in-time placebo returns p = {p_value} over {n_draws} shifted alignments."
  mis_timed: "The mis-timed dose, shifted {lead_months} months, returns {coefficient}."
  lead_shift: "The lead-shift check covers {n_draws} shifted alignments and returns p = {p_value}."
  not_run_heading: "Why this design was not run"
  next_step: "Next step"
  c_heading: "The synthetic counterfactual"
  c_intro: "{estimated} windows were estimated against a synthetic Nigeria built from {donors} donor countries; {refused} window was refused by the declared minimum, and {identified} survived its placebos. The gap is in deaths per 1,000 live births, and the bracketed figure is the same problem under a unique ridge refit: where the two disagree, the estimate belongs to the solver rather than to the data."
  c_row: "{years} — gap {gap} (ridge {ridge}), placebo p = {p}, {status}"
  c_note: "A synthetic control has no sampling distribution, so there is no interval here and none of these gaps is a card number."
  transition_heading: "Did anything move at a transition?"
  transition_note: "Four transitions, two outcomes, and a placebo drawn from every eligible month. The rows below name the month, not the person: a shift at a transition is not a verdict on a presidency, and this page will not print one."
  not_claimed_heading: "What this does not claim"
  rule_heading: "The rule the verdicts were read against"
  event_line: "{month} · {outcome} · {status} · placebo p = {p_value}"
  event_status:
    shift_detected: "a shift survives both checks"
    not_interpretable_pre_trend: "a shift, but the pre-trend check fails"
    no_shift_detected: "no shift beyond the placebo"
    check_not_available: "the check cannot be run"
  outcome_unknown: "an outcome the registry does not label"
  back: "Back to the flow"
