# The guided flow's wording: declared, not typed into the renderer
#
# Every sentence, status word and label the site can show lives here, so that the wording is reviewable as a
# document and the site is not the place where prose is invented. `tests/verify_guide.py` checks coverage both
# ways: every design, status, reason code and grouping the renderer may show must have an entry, and every entry
# must be used by at least one rendered page.
#
# **Placeholders.** `cover.paragraphs` and `study.caption` may carry `{name}` slots. The build substitutes them
# from the artifacts and refuses to write a page if a slot has no value, or if a value has no slot. The declared
# slots are listed under `placeholders` and are the only names the renderer will fill.

version: 1
layer: "plain words for the guided flow: design names, status words, reasons, cover copy"

placeholders:
  window_first: "the study window's first month, from registry/series/<vintage>/index.json"
  window_last: "the study window's last month"
  administrations: "the number of administrations, from registry/reference/administrations.json"
  spine_total: "outcome-months covered by the twelve panels"
  spine_observed: "outcome-months that are observations"
  estimated: "cards carrying a published number, from registry/dags/index.json"
  cards: "cards in the registry"
  outcomes: "outcomes in the catalogue, from registry/dags/index.json"
  covariates: "catalogue metrics that are not outcomes, from dbt/seeds/raw_metric_catalogue.csv"

cover:
  eyebrow: "Nigeria · 1999-present"
  title: "Causal Presidents"
  caption: "Presidential transitions and national outcomes in Nigeria, 1999‑present."
  instruction: "Causal models have assumptions. Study them before you read the numbers."
  rail_heading: "Five administrations"
  models_line: "{models} models compared"
  scope_line: "{outcomes} outcomes · {covariates} covariates · {spine_observed} of {spine_total} outcome-months observed"
  methods_line: "Two-way fixed effects, local projections and synthetic control"
  span_line: "{designs} identification designs · {specifications} fitted specifications · {first_year}–{last_year}"
  portrait_credits: "Photograph credits"
  premise_lines:
    - "Causal inference is how a presidential transition can be tested against national outcomes."
    - "We show what can and cannot be compared."
  paragraphs:
    - "What can and cannot be said about Nigeria between {window_first} and {window_last}, across {administrations} administrations."

# What each catalogue outcome counts, in words a reader does not need a data dictionary for. Rendered in
# brackets after the outcome's label on the study screen: the label names the metric, this says what it is.
# The build refuses an outcome with no gloss rather than printing a bare label.
outcome_plain:
  u5mr: "children who die before their fifth birthday, out of every 1,000 born"
  mmr: "mothers who die from pregnancy or childbirth, out of every 100,000 births"
  immun_penta3: "babies who get the three-dose pentavalent vaccine, as a share of all surviving infants"
  skilled_birth: "births attended by a trained health worker, as a share of all births"
  literacy_youth: "people who can read and write, as a share of everyone aged 15 to 24"
  primary_completion: "children who finish primary school, as a share of those of the age to be there"
  ner_primary: "children of primary-school age enrolled in primary school, as a share of that age group"
  fatalities: "people killed in reported conflict events, counted"
  incidents: "reported conflict events, counted; one massacre counts once, whatever the death toll"
  gdp_growth: "how much the economy grew or shrank over the year, after inflation"
  cpi_yoy: "how fast prices rose over the last year, as a percentage"
  unemp: "people who want work and cannot find it, as a share of the labour force"

study:
  heading: "What do you want to study?"
  intro: "Pick a category, then an outcome. A thin or gappy series still gets a change-point search and a trend reading."
  next: "Next"
  next_disabled: "Pick at least one outcome to continue."
  category_label: "Category"
  groups:
    health: "Health"
    education: "Education"
    security: "Security"
    economy: "Economy"

compare:
  heading: "What gets compared"
  # No intro: the heading already says it. Each card is one sentence, the comparison folded together with
  # the one assumption it leans on plus the trust pill, and only a reason when the card carries no number.
  # The stamp names the card's kind, so the four kinds (number, described, channel, gap) are visible from
  # across the room. Where the rest of it lives: unit, direction and coverage on the study screen; the
  # reason code, the blocker and the detail on the estimate screen; the assumption drawn, on the graph screen.
  number_chip: "carries a published number"
  no_number_stamp: "no number here"
  channel_chip: "about the money channel"
  gap_stamp: "a declared gap"

designs:
  A:
    name: "State dose-response DiD"
    short: "DiD"
    plain_comparison: "states that got more federal money, against states that got less"
    assumes: "nothing else moved them differently in the same months"
  B:
    name: "National VECM / ARDL time series"
    short: "Time series"
    plain_comparison: "the states' money after an oil price move, against the months before"
    assumes: "nothing else moved that money at the same time"
  C:
    name: "Synthetic control (cross-country)"
    short: "Synthetic control"
    plain_comparison: "Nigeria against a made-up Nigeria built from similar countries"
    assumes: "the twin tracks Nigeria without the change"

# Stage 5's card verdicts, in the reader's words. The tone is the colour the page may use.
status:
  pass:
    word: "usable"
    tone: "good"
    sentence: "its check passed before anything was estimated"
  degraded:
    word: "usable with a warning"
    tone: "warn"
    sentence: "a weaker version of the design"
  fail:
    word: "the check it needed failed"
    tone: "bad"
    sentence: "the result is absent or published as not identified"
  not_attempted:
    word: "not attempted"
    tone: "bad"
    sentence: "it could not be run for this outcome"

# The registry's closed set of reasons a card carries no number, plus the one reason a card carries no
# interval: a design may be estimated and still not identified, which is a different reader situation from
# not being run. The site prints the sentence; the card and the app carry the detail.
reasons:
  design_estimated_not_identified:
    sentence: "The design ran but cannot isolate an effect, so there is no number."
  outcome_series_absent:
    sentence: "There are too few observed years to estimate on."
  no_specification_declared:
    sentence: "No specification was declared for this pair, so nothing was estimated."
  outcome_not_at_design_grain:
    sentence: "The outcome exists, but not at the grain this design needs: for example only nationally, when the design compares states."
  design_result_is_channel_level:
    sentence: "The result is about the money channel, not this outcome."
  design_not_run:
    sentence: "The design was not run for this outcome."

coverage:
  ok: "measured"
  partial: "partly measured"
  declared_gap: "declared gap"

# The bracket that tells a reader what the coverage word means. A word like "partly measured" is only useful if
# the screen says what was partly measured.
coverage_note:
  ok: "observed in every period the series claims"
  partial: "some periods are filled in or modelled, not observed"
  declared_gap: "no data for part of the window, not a zero"

# The parties the five administrations belong to, with the colours their Wikipedia infoboxes declare. The site
# draws these as vertical bands behind each portrait, a declared backdrop and not an endorsement (see
# docs/portraits.md §1, and the override recorded in docs/decisions.md).
parties:
  PDP:
    name: "Peoples Democratic Party"
    bands: ["#006903", "#FFFFFF", "#F0001C"]
    source: "English Wikipedia infobox colour swatches, retrieved 2026-10-27"
  APC:
    name: "All Progressives Congress"
    bands: ["#87BEEB", "#39944A", "#FFFFFF", "#E52B33"]
    source: "English Wikipedia infobox colour swatches, retrieved 2026-10-27"

# The national flag, drawn as a backdrop behind the cover's photographs: a green-white-green vertical triband.
national_flag:
  bands: ["#008751", "#FFFFFF", "#008751"]
  source: "Nigerian flag, green-white-green vertical triband"

direction:
  up: "higher is better"
  down: "lower is better"

groupings:
  party_tenure:
    plain: "by who was in power"
    technical: "party × tenure stratum"
  state_dose_quartile:
    plain: "by how much money a state received"
    technical: "FAAC dose quartile"

labels:
  technical_expander: "The technical version"
  plain_reading: "What this says in plain words"
  graph_heading: "The assumption, drawn"
  graph_assumption: "The assumption"
  graph_caption: "The unobserved node is drawn, not omitted; adjustment sets are computed, never hand-listed."
  adjustment_heading: "Adjustment set"
  absent_heading: "Assumed absent"
  cannot_heading: "What this cannot rule out"
  adjustment_gloss: "what the comparison holds fixed"
  absent_gloss: "the thing that must not exist"
  cannot_gloss: "what could still spoil it"
  chart_heading: "The comparison, drawn"
  alternatives_heading: "The other graphs for this outcome"
  failed_check_prefix: "Failed its check"
  back: "Back"
  next: "Next"

steps:
  cover: "Start"
  study: "What to study"
  compare: "The comparisons"
  graph: "The assumption"
  estimates: "The estimate"
  chart: "The chart"
  ask: "Ask"

# The header collage: three events per page, drawn from the sourced strip manifest. The pages name slugs, not
# files, so a licence row and a file move together; the event's own attribution travels into the footer credits.
event_strip:
  study: ["independence_1960", "chibok_2014", "election_2023"]
  compare: ["civil_war_1968", "campaign_2015", "endsars_2020"]
  graph: ["oil_flares", "handover_2015", "election_2023"]
  estimates: ["independence_1960", "bodo_creek", "campaign_2015"]
  chart: ["civil_war_1968", "oil_flares", "endsars_2020"]
  ask: ["chibok_2014", "handover_2015", "election_2023"]
  designs: ["independence_1960", "campaign_2015", "endsars_2020"]
  about: ["civil_war_1968", "bodo_creek", "handover_2015"]
  methodology: ["oil_flares", "chibok_2014", "election_2023"]
  technical: ["independence_1960", "campaign_2015", "bodo_creek"]

ask:
  heading: "Ask the corpus"
  intro: "Answers come from the published corpus, through the same gate and contract the local app uses. No model is called."
  placeholder: "e.g. how much of the monthly series is observed?"
  input_label: "Your question"
  button: "Ask"
  clear: "Clear"
  empty: "Type a question about the study."
  loading: "Reading the corpus…"
  error: "The answer layer did not load in this browser. The local app's Ask tab reads the same corpus."
  measured: "{answered} of {total} questions are answered; the rest decline and say why."
  deeper: "The design-level results"
  refused_heading: "Why this is refused"
  declined_heading: "Why there is no answer"
  source_heading: "Where this comes from"

results:
  heading: "The estimate"
  trend_label: "Not an estimate. Widest trend gap: "
  sparse_label: "What we have: "
  association: "In the same state and month, a 1 % higher {exposure} goes with {change} % {direction} {outcome}."
  predictors:
    "log(faac_gross_total_naira)": "federal allocation received by the state"
  designs_link: "design-level results"
  # The old `number` template ("The estimate is X, with a 95 % interval ... and p = ...") was retired on
  # 2026-11-04: the hero carries the figure and its interval, the plain text carries the association, and the
  # p-value lives in the technical expander, where a reader who wants it knows to look. Leaving the template
  # in place would have been a second, unused description of the same card.
  includes_zero: "The interval includes zero."
  excludes_zero: "The interval stays on one side of zero."
  sample: "On {n_obs} observations over {n_units} units, {first_month} to {last_month}."
  verdict: "Verdict: {verdict}."
  failed_check: "The check that decided it: {failed_check}."
  no_number: "{reason_sentence}"
  no_number_stamp: "no number here"
  gap_stamp: "a declared gap, not a zero"
  channel_chip: "about the money channel"
  channel_note: "The published number is about the national money channel, not about this outcome."
  tiny_note: "Read as a proportional change: {reading}."
  expander: "The technical version"
  groups_heading: "What each group's average is"
  stamp_note: "Charts describe. Claims live on the estimate screen. A 99-country comparison was tried for under-5 mortality and refused, so no line here is a verdict on a tenure."
  summary: "Outcomes with a number: {numbered} of {chosen}. The rest are explained on the comparisons screen."

chart:
  # The old per-figure stamp ("description, not a causal comparison", twice per outcome plus once inside
  # every published SVG) said the same thing four times per screen. The page header now carries it once,
  # in short; the artifact figures keep their own printed stamp because they are frozen files.
  observed_mark: "a dot is a month that exists"
  interpolated_mark: "a dotted line is a month filled in between two observations"
  dose_note: "no state-level series"

changepoint:
  heading: "When the series changes"
  # No per-panel intro, no repeated break disclaimer: the method line under each figure carries the
  # estimator, and a refusal is the artifact's own caption. One description per figure, no more.
  marker_label: "the series changes here"
  timing_note: "A break within two months of a swearing-in is recorded as timing only."

# Stage 8g - the tenure description (analysis/specs/tenure.yml)
tenure:
  heading: "Each president against the trend"
  note: "The trend is fitted without ever seeing who was in power."
  head_tenure: "Tenure"
  head_party: "Party"
  head_points_annual: "Years"
  head_points_monthly: "Months"
  head_points_quarterly: "Quarters"
  head_points_default: "Points"
  head_compare: "Comparison with the president before"
  head_change: "Change"
  # The line under each trend table is one short paragraph of findings, not a method note: whose deviation
  # was furthest from the trend, which president-to-president moves hold under every trend setting, and
  # which moves stay neutral. Generated from the artifact rows and contrasts; no number is typed here.
  finding_furthest: "Furthest from the trend: {president}, averaging {value} {side} it."
  finding_changes: "Across all settings, {items}."
  finding_item: "{name} {direction} {previous}"
  finding_better: "better than"
  finding_worse: "worse than"
  finding_no_changes: "No move between consecutive presidents holds across all trend settings."
  finding_neutral: "The move from {previous} to {name} is not consistent across settings, so it is neutral."
  finding_join: "; "
  side_above: "above"
  side_below: "below"
  # The table compares each president with the one before him, using the artifact's published pairwise
  # contrasts (difference = earlier mean_deviation - later, with the range across the declared spans, not
  # a sampling interval). A change is claimed only when the contrast range cannot contain zero. Direction
  # follows the outcome's own direction, never a president. The first span shows the start marker.
  change_first: "start"
  change_none: "no earlier span"
  change_neutral: "no change, neutral"
  change_good: "change, good"
  change_bad: "change, bad"
  change_vs: "vs {previous}: {delta} [{range}]"
  contrast_heading: "Largest pairwise contrast"
  refused: "A trend needs at least {minimum} native observations, and this series has {points}."

# Screen 6b: the design-level results. One section per artifact family. Every value below is filled from an
# artifact field; the templates carry no number of their own.
design_results:
  heading: "The design-level results"
  intro: "The three figures that decided the verdicts below. Each is drawn by R from the same rows this page counts."
  figure_note: "The figure is the artifact. If it were one re-fit behind the table, its recorded byte count would no longer match the file."
  verdict_label: "Verdict"
  published_heading: "What was published"
  row: "{outcome}: {coefficient}, 95 % interval [{interval}], {obs} observations"
  channel_outcome: "the national money that reached the states"
  outcome_labels:
    fatalities_civilians: "civilian fatalities (a UCDP item counted inside the security outcome)"
  checks_heading: "The checks that decided it"
  grid_heading: "What the grid found"
  flip: "{axis} = {level}: {n_opposite} of {n} specifications point the other way"
  support: "{n_positive} of {n} specifications are positive, {n_negative} negative, and {n_near_zero} sit inside the near-zero band."
  spread: "Across the grid the coefficient runs from {min} to {max}."
  placebo: "The in-time placebo returns p = {p_value} over {n_draws} shifted alignments."
  mis_timed: "The mis-timed dose, shifted {lead_months} months, returns {coefficient}."
  lead_shift: "The lead-shift check covers {n_draws} shifted alignments and returns p = {p_value}."
  not_run_heading: "Why this design was not run"
  next_step: "Next step"
  c_heading: "The synthetic counterfactual"
  c_intro: "{outcomes} outcomes, {estimated} windows estimated against a synthetic Nigeria built from {donors} donor countries; {refused} windows refused by the declared rule, and {identified} survived their placebos. Each outcome is its own fit in its own unit, so a gap of 2 in one is not twice a gap of 1 in another. The bracketed figure is the same problem under a ridge refit: where the two disagree in sign, the estimate belongs to the solver rather than to the data."
  c_row: "{years}: gap {gap} (ridge {ridge}), placebo p = {p}, {status}"
  c_refusal_note: "One outcome was fitted a second way in 2026, with an estimator that does not depend on the 99-donor simplex: under-5 mortality. It refused as well, every window sitting inside the range that treating a random country produces, so the refusal does not rest on the ridge check alone. That second fit is reported in the project's documentation, not on this page, and no number from it is published."
  c_note: "A synthetic control has no sampling distribution, so there is no interval here and none of these gaps is a card number. An outcome whose every window was refused is listed with the reason instead."
  c_refused_outcome: "Every declared window was refused for this outcome: Nigeria's series cannot fill a window of this design's declared length. The card carries the reason."
  transition_heading: "Did anything move at a transition?"
  transition_note: "Four transitions, two outcomes, and a placebo drawn from every eligible month. The rows below name the month, not the person: a shift at a transition is not a verdict on a presidency, and this page will not print one."
  not_claimed_heading: "What this does not claim"
  rule_heading: "The rule the verdicts were read against"
  event_line: "{month} · {outcome} · {status} · placebo p = {p_value}"
  event_status:
    shift_detected: "a shift survives both checks"
    not_interpretable_pre_trend: "a shift, but the pre-trend check fails"
    no_shift_detected: "no shift beyond the placebo"
    check_not_available: "the check cannot be run"
  outcome_unknown: "an outcome the registry does not label"
  back: "Back to the flow"

# ---------------------------------------------------------------------------------------------
# The primary navigation. Home, About, Methodology and Technical sit outside the flow; Ask is its sixth
# step, carried in the nav so a reader who lands on a bookmarked page can search the registry from there.
# ---------------------------------------------------------------------------------------------
nav:
  home: "Home"
  about: "About"
  methodology: "Methodology"
  technical: "Technical"
  ask: "Ask"

about:
  eyebrow: "About"
  heading: "About this project"
  intro: "Causal Presidents is a working paper in the shape of a website: what five administrations and twenty-seven years of Nigerian data can support, and what they cannot."
  paragraphs:
    - "The site is built from a registry of committed artifacts. Each outcome has a page carrying the comparison the data supports, the assumption it depends on, and the number, or the reason there is none. Nothing is fitted in the browser."
    - "It is written for a reader who will check: journalists, students, policy analysts, and anyone who has been told that a president caused something. Every claim links back to the file that carries it."
    - "The provenance rule is the base spec's. Restricted raw sources are never republished; derived aggregates, code and the model cards are."
  todo_heading: "Still to come"
  todo_note: "This page is deliberately a frame. The items below are not published yet, and the site says so rather than inventing them."
  todo:
    - "Author, affiliation and contact."
    - "Funding and conflicts of interest."
    - "How to cite the site and the registry vintage."
    - "Licences for the text, the code and the portraits, in one place."
    - "A changelog a reader can follow."

methodology:
  eyebrow: "Why these models"
  heading: "Methodology"
  intro: "The problem, the work this sits beside, and what this project does differently. Variable names, the model table and the estimating equations are on the Technical details page. Every number here is generated from the registry when the page is built."
  sections:
    - id: problem
      heading: "1. The problem"
      paragraphs:
        - "Nigeria's public argument is usually about presidencies: did this administration improve health, reduce violence, grow the economy? The question is asked of five administrations and roughly twenty-seven years of annual national data. Four to five units against 22 to 23 observations per outcome cannot identify a per-president effect; the smallest detectable effect is tens of residual standard deviations."
        - "This project asks what can be identified instead. It treats every outcome-and-design pair as its own model, publishes the number when a design earns one, and publishes the reason when it does not. {models} models are compared across {designs} identification designs and {specifications} fitted specifications, {first_year} to {last_year}."
      bullets:
        - "Twelve outcomes across health, education, security and the economy."
        - "No causal verb without a named design, its identifying assumption, and the check that could have killed it."
    - id: prior
      heading: "2. What exists"
      paragraphs:
        - "Four strands of work bear directly on this one. The project uses their methods and inherits their warnings; the references are listed at the end with DOIs, checked against Crossref on 2026-10-28."
      works:
        - strand: "Synthetic control"
          body: "Comparative case studies with a weighted donor pool, and the later statement of when the method is credible."
          refs: "Abadie & Gardeazabal (2003); Abadie, Diamond & Hainmueller (2010); Abadie (2021)"
        - strand: "Panel designs and local projections"
          body: "Staggered difference-in-differences, the decomposition of two-way fixed effects under variable timing, and local projections for shock transmission."
          refs: "Callaway & Sant'Anna (2021); Goodman-Bacon (2021); Jordà (2005)"
        - strand: "Reporting the multiverse"
          body: "Fit the grid, publish the distribution, and say which specification was preferred before seeing it."
          refs: "Simonsohn, Simmons & Nelson (2020); Athey & Imbens (2017)"
        - strand: "Nigeria and the region"
          body: "The resource-curse account of Nigeria's political economy, the greed-and-grievance account of civil war, and the micro evidence that democratisation reduced infant mortality in sub-Saharan Africa."
          refs: "Sala-i-Martin & Subramanian (2003); Collier & Hoeffler (2004); Kudamatsu (2012)"
    - id: improve
      heading: "3. What this project does differently"
      items:
        - title: "The specification is written before the number"
          body: "Every design lives in a committed spec file whose md5 the artifact records. Windows and verdict rules are read from those files at run time, not retyped."
        - title: "Absence is a published output"
          body: "Of {models} model cards, {estimated} carry a number and {no_number} carry a reason from a closed set. Thirty-four unexplained blanks cannot be mistaken for thirty-four null results."
        - title: "Placebos decide, and the solver's choice is on the record"
          body: "The synthetic control publishes its in-space and in-time placebos: {placebos_passing} of {placebos_total} placebo fits clear the same pre-fit threshold, which is why it reports no identified effect. Because the weights are not unique with {donors} donors, the artifact publishes the vertex and a ridge refit side by side."
        - title: "Data honesty is drawn, not asserted"
          body: "Of {spine_total} outcome-months, {spine_observed} are observations; interpolated months are drawn dashed and tests run on the native grain. Every stage is re-derived by one of {verifiers} independent verifiers in the chain."
    - id: limits
      heading: "4. What it does not claim"
      bullets:
        - "No ranking of presidents, no scorecard, and no pooled tenure effect."
        - "No party comparison: two events against two events has no sampling distribution."
        - "No forecast: the site publishes what happened, not what will."
        - "No monthly causal statement from an annual series."
        - "No country comparison: a 99-country match was tried for under-5 mortality and could not separate any tenure from what a random country produces."
        - "No causal verb without a named design, its assumption and its failed-check evidence."
  # Provenance: the one section of the site that names the files. Every other page says what a number
  # means; this says where it lives, and the Technical page a link away carries the detail.
  provenance_heading: "Where the numbers live"
  provenance_note: "Everything the site shows was already computed into these committed files when the registry was built. No page renders by reading a database or refitting anything."
  provenance_link_note: "The detail, with the equations, the variables and the estimator tables, is on the technical page."
  references_heading: "References"
  references_note: "Bibliographic details checked against Crossref on 2026-10-28. DOIs are printed as text, not links: the site makes no network request, by design."
  references:
    - "Abadie, A., & Gardeazabal, J. (2003). The economic costs of conflict: A case study of the Basque Country. American Economic Review, 93(1), 113–132. https://doi.org/10.1257/000282803321455188"
    - "Abadie, A., Diamond, A., & Hainmueller, J. (2010). Synthetic control methods for comparative case studies: Estimating the effect of California's tobacco control program. Journal of the American Statistical Association, 105(490), 493–505. https://doi.org/10.1198/jasa.2009.ap08746"
    - "Abadie, A. (2021). Using synthetic controls: Feasibility, data requirements, and methodological aspects. Journal of Economic Literature, 59(2), 391–425. https://doi.org/10.1257/jel.20191450"
    - "Callaway, B., & Sant'Anna, P. H. C. (2021). Difference-in-differences with multiple time periods. Journal of Econometrics, 225(2), 200–230. https://doi.org/10.1016/j.jeconom.2020.12.001"
    - "Goodman-Bacon, A. (2021). Difference-in-differences with variation in treatment timing. Journal of Econometrics, 225(2), 254–277. https://doi.org/10.1016/j.jeconom.2021.03.014"
    - "Jordà, Ò. (2005). Estimation and inference of impulse responses by local projections. American Economic Review, 95(1), 161–182. https://doi.org/10.1257/0002828053828518"
