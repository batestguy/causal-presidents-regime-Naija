# CI for the verification chain.
#
# Two jobs, because they have genuinely different requirements.
#
# `static` runs on every push and needs nothing but the repository: the artifact-contract test
# (scripts/validate_artifacts.py), byte-compilation, the registry JSON Schemas, and lint. Raw payloads are
# gitignored per the design spec's redistribution constraint, so the payload-shape half of the contract
# test reports itself as SKIPPED here rather than pretending to pass.
#
# `data` runs the full chain — acquire, parse, gate, build, estimate, fit the robustness grid, fit the
# transition event study, the intent gate, the answer layer, and all fourteen verifiers — and needs
# the raw layer: network access plus a FRED key (UCDP needs none: its bulk archive is keyless, C-45). It
# runs on demand and weekly rather than on every push, because re-landing 174 FAAC documents and a 29 MB
# archive costs minutes and the raw layer is immutable (X-07), so a re-run lands a NEW vintage rather
# than reproducing the old one. Stage 6 additionally needs R; without it the engine is skipped and the
# committed estimates are still verified against the freshly built base.
#
# Why CI at all for a one-person research project: the verifiers had already failed silently against the
# current data twice before anyone noticed (C-42, C-44). The discipline was real; the *running* of it was
# a memory.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  static:
    name: static contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install verification dependencies
        run: pip install -r requirements-dev.txt
      - name: compile
        run: >-
          python -m py_compile
          ingestion/clients/*.py ingestion/flows/*.py ingestion/parsers/*.py
          ingestion/quality/*.py tests/*.py scripts/*.py app/*.py
      - name: artifact contracts
        run: python scripts/validate_artifacts.py
      - name: lint
        run: ruff check . || true # recorded, not gating: the repo carries pre-existing noqa conventions
      # The site is a second renderer over the same artifacts, and the browser's answer layer is a second
      # implementation of the gate. Both are checked here, on the runner that needs nothing but the repo:
      # verify_site.py rebuilds the pages and compares them with the registry, and verify_answer_js.py runs
      # the JS layer over the published answer artifact and accepts it only if it reproduces those answers.
      - name: site pages against the registry
        run: python tests/verify_site.py
      - name: answer layer (JavaScript) against the published answers
        run: python tests/verify_answer_js.py
        # verify_comparisons.py and verify_changepoints.py are deliberately not here: they re-derive their
        # numbers from data/analytics.duckdb, which is a build artifact and is never committed. They run in
        # the data job, where `dbt build` has produced it.

  # Deploy only what the static job has already checked. The pages job does not build its own site from an
  # unchecked tree: it rebuilds from the same commit after `static` passed, so a page that disagreed with the
  # registry cannot reach the public URL.
  pages:
    name: deploy the site
    needs: static
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install build dependencies
        run: pip install -r requirements-dev.txt
      - name: build the site
        run: python site/build.py
      - name: upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4

  data:
    name: full data chain
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ingestion, transformation and verification dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: verify (acquire, parse, gate, build, all fourteen verifiers)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: scripts/verify.sh
