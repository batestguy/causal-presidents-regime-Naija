# The phase gate's state - the single place the completion plan's progress is recorded.
#
# The plan (`presidents-completion-plan.md`) states the order the project's remaining work happens in.
# This file states where the project stands in it, and `scripts/check_phase_gate.py` checks that the
# standing complies with the order. Editing the plan's prose alone is not compliance: a phase move
# happens by editing the statuses *here*, and the gate fails the whole chain if the move skips ahead.
#
# `status` is one of: `not_started` | `in_progress` | `done`.
#   - at most one phase may be `in_progress`;
#   - every phase before it (and before each done phase) must be `done`;
#   - every phase after it must be `not_started`;
#   - a `done` phase must carry evidence: one entry per exit check, each naming the check that ran and
#     the date it ran on (`scripts/check_phase_gate.py` enforces the shape).
plan: presidents-completion-plan.md
phases:
  - id: A
    title: adopt GED 26.1 (the data revision pass)
    status: done
    evidence:
      - check: "scripts/validate_artifacts.py PASS (74 registry documents, every stage describing the 2026-10-30 gate report)"
        date: "2026-10-30"
      - check: "all 23 tests/verify_*.py PASS (quality, stage5, stage6, stage7, registry, harmonisation, faac, nbs_cpi, dags, events, series, comparisons, changepoints, tenure, design_c, provenance, rag, intent, answer, answer_quality, app, site, answer_js)"
        date: "2026-10-30"
      - check: "dbt build 178/178 PASS on the 26.1 staging (schema unchanged: a revision moves values, not columns)"
        date: "2026-10-30"
      - check: "R chain re-run in declared order 02 -> 01 -> 11 -> 03 -> 04 -> 05 -> 06..10, every stage green"
        date: "2026-10-30"
      - check: "RAG corpus rebuilt with --embed (485 chunks), eval_rag / eval_intent / eval_answer / eval_answer_quality re-measured"
        date: "2026-10-30"
      - check: "data/pending/ empty; raw vintage 2026-10-30 sha256 8c941d84... equals the parked copy; field-by-field diff vs the 2026-10-29 family recorded as C-82"
        date: "2026-10-30"
  - id: B
    title: the monthly inflation outcome in Design B (the subsidy estimand)
    status: in_progress
    evidence: []
  - id: C
    title: close or permanently record every not-estimated reason
    status: not_started
    evidence: []
  - id: D
    title: optional RAGAS library run on Colab
    status: not_started
    evidence: []
  - id: E
    title: delivery polish
    status: not_started
    evidence: []
  - id: F
    title: completion freeze
    status: not_started
    evidence: []
